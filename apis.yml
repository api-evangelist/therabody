aid: therabody
name: Therabody
description: 'Therabody is a Los Angeles-based wellness technology company founded in
  2016 by Dr. Jason Wersland, best known for inventing the Theragun percussive therapy
  device. Its product ecosystem spans percussive therapy (Theragun), pneumatic compression
  (RecoveryAir), electrical stimulation (PowerDot), vibration therapy (Wave) and the
  Therabody companion app. Therabody publishes no traditional developer program, but
  its direct-to-consumer storefront at therabody.com runs on Shopify and exposes a
  substantial machine-readable commerce surface: an open Storefront GraphQL API, a
  Universal Commerce Protocol (UCP) MCP server for agent-driven catalog search, cart
  and checkout, a customer-account MCP server for order status and returns, OAuth 2.0
  / OpenID Connect discovery, and published agent instructions at /llms.txt and /agents.md.'

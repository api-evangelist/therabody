apis:
- aid: therabody-ucp-commerce-mcp
  name: Therabody UCP Commerce MCP
  description: 'Therabody''s agent-facing commerce server, implementing the Universal
    Commerce Protocol (UCP) shopping service over MCP on the Therabody storefront host.
    Anonymous tools/list returns 13 tools with full JSON Schema input contracts covering
    catalog search and lookup, product detail, cart create/get/update/cancel, and the
    full checkout lifecycle (create, get, update, complete, cancel). Checkout completion
    requires explicit buyer approval per the published agent instructions.'
  humanURL: https://www.therabody.com/agents.md
  baseURL: https://www.therabody.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - UCP
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/therabody-mcp.yml
  - type: ToolCrosswalk
    url: mcp/therabody-tool-crosswalk.yml
- aid: therabody-storefront-graphql
  name: Therabody Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API served from the Therabody US storefront
    host. Anonymous introspection is open and returns 416 types across 35 query root
    fields covering products, collections, carts, search, blogs, pages, menus, metaobjects,
    localization and payment settings. The full SDL is captured in graphql/ from a
    live introspection query.'
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://www.therabody.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - Storefront
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/therabody-storefront.graphql
- aid: therabody-customer-account-mcp
  name: Therabody Customer Account MCP
  description: 'Therabody''s customer-account MCP server on account.therabody.com,
    exposing four post-purchase tools: most-recent order status, order status by order
    number, store credit balances, and return requests. Tool discovery is anonymous;
    tool execution requires a customer OAuth bearer token carrying the customer-account-mcp-api
    scope.'
  humanURL: https://account.therabody.com/
  baseURL: https://account.therabody.com/customer/api/mcp
  tags:
  - MCP
  - Customer Account
  - Order
  - Returns
  tags_raw:
  - MCP
  - Customer Account
  - Orders
  - Returns
  properties:
  - type: MCPServer
    url: mcp/therabody-mcp.yml
